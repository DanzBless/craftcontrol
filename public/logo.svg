<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#07090e" stop-opacity="1"/>
    </radialGradient>

    <!-- Cube Gradients -->
    <linearGradient id="topFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>

    <linearGradient id="leftFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>

    <linearGradient id="rightFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Orbit Gradients -->
    <linearGradient id="orbitGlowPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="70%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.1"/>
    </linearGradient>

    <linearGradient id="orbitGlowSecondary" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Core Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="halo" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
    </filter>
  </defs>

  <!-- Ambient Backdrop Halo -->
  <circle cx="256" cy="256" r="140" fill="#38bdf8" opacity="0.15" filter="url(#halo)"/>

  <!-- BACK ORBITS (Rendered Behind Cube) -->
  <g transform="rotate(-25 256 256)">
    <!-- Primary Back Orbit Arc -->
    <path d="M 56 256 A 200 68 0 0 1 456 256" stroke="url(#orbitGlowPrimary)" stroke-width="4" stroke-linecap="round" opacity="0.4" stroke-dasharray="8 6"/>
  </g>

  <g transform="rotate(35 256 256)">
    <!-- Secondary Back Orbit Arc -->
    <path d="M 86 256 A 170 54 0 0 1 426 256" stroke="url(#orbitGlowSecondary)" stroke-width="3" stroke-linecap="round" opacity="0.3"/>
  </g>

  <!-- THE MINECRAFT CORE CUBE -->
  <!-- Left Shadow Casting Base -->
  <g id="cube">
    <!-- Top Face -->
    <polygon points="256,150 346,202 256,254 166,202" fill="url(#topFace)"/>
    
    <!-- Top Face Grid / Voxel Accent -->
    <polygon points="256,150 301,176 256,202 211,176" fill="#ffffff" opacity="0.35"/>
    <polygon points="256,202 301,228 256,254 211,228" fill="#cbd5e1" opacity="0.2"/>

    <!-- Left Face -->
    <polygon points="166,202 256,254 256,358 166,306" fill="url(#leftFace)"/>
    
    <!-- Left Face Voxel Inset -->
    <polygon points="166,202 211,228 211,332 166,306" fill="#64748b" opacity="0.4"/>
    
    <!-- Right Face -->
    <polygon points="256,254 346,202 346,306 256,358" fill="url(#rightFace)"/>

    <!-- Right Face Voxel Inset -->
    <polygon points="301,228 346,202 346,306 301,332" fill="#0f172a" opacity="0.4"/>

    <!-- Cube Bevel Edge Lines -->
    <line x1="256" y1="150" x2="256" y2="254" stroke="#ffffff" stroke-width="2" opacity="0.6"/>
    <line x1="166" y1="202" x2="256" y2="254" stroke="#ffffff" stroke-width="1.5" opacity="0.4"/>
    <line x1="346" y1="202" x2="256" y2="254" stroke="#ffffff" stroke-width="1.5" opacity="0.4"/>
    <line x1="256" y1="254" x2="256" y2="358" stroke="#38bdf8" stroke-width="2" opacity="0.8"/>
  </g>

  <!-- FRONT ORBITS (Rendered in Front of Cube for 3D Depth) -->
  <g transform="rotate(-25 256 256)">
    <!-- Primary Front Orbit Arc (Sweeps in front of the cube) -->
    <path d="M 456 256 A 200 68 0 0 1 56 256" stroke="url(#orbitGlowPrimary)" stroke-width="5" stroke-linecap="round" filter="url(#glow)"/>

    <!-- Satellite Node on Primary Orbit -->
    <circle cx="390" cy="298" r="8" fill="#ffffff" filter="url(#glow)"/>
    <circle cx="390" cy="298" r="14" stroke="#38bdf8" stroke-width="2" opacity="0.6"/>
    <circle cx="390" cy="298" r="4" fill="#38bdf8"/>
  </g>

  <g transform="rotate(35 256 256)">
    <!-- Secondary Front Orbit Arc -->
    <path d="M 426 256 A 170 54 0 0 1 86 256" stroke="url(#orbitGlowSecondary)" stroke-width="3.5" stroke-linecap="round" opacity="0.85"/>
    
    <!-- Secondary Satellite Node -->
    <circle cx="120" cy="275" r="5" fill="#ffffff"/>
    <circle cx="120" cy="275" r="10" stroke="#a855f7" stroke-width="1.5" opacity="0.5"/>
  </g>

  <!-- Sparkle Particle Accents -->
  <circle cx="210" cy="110" r="2" fill="#ffffff" opacity="0.8"/>
  <circle cx="340" cy="130" r="3" fill="#38bdf8" opacity="0.7"/>
  <circle cx="130" cy="370" r="2.5" fill="#38bdf8" opacity="0.6"/>
  <circle cx="390" cy="380" r="2" fill="#ffffff" opacity="0.7"/>
</svg>
