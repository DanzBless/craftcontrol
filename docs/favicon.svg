<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%" fill="none">
  <rect width="64" height="64" rx="14" fill="#080b11"/>
  <!-- Back Orbit -->
  <ellipse cx="32" cy="32" rx="26" ry="11" stroke="#38bdf8" stroke-width="2" opacity="0.3" transform="rotate(-28 32 32)"/>
  
  <!-- Isometric Cube -->
  <!-- Top -->
  <polygon points="32,15 44,22 32,29 20,22" fill="#ffffff"/>
  <!-- Left -->
  <polygon points="20,22 32,29 32,45 20,38" fill="#94a3b8"/>
  <!-- Right -->
  <polygon points="32,29 44,22 44,38 32,45" fill="#475569"/>
  <!-- Center dividing line -->
  <line x1="32" y1="29" x2="32" y2="45" stroke="#38bdf8" stroke-width="1.5"/>

  <!-- Front Orbit -->
  <path d="M 55 32 A 26 11 0 0 1 9 32" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" transform="rotate(-28 32 32)"/>
  <!-- Satellite -->
  <circle cx="48" cy="38" r="2.5" fill="#ffffff"/>
</svg>
